<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness &amp; Wellness Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Welcome splash. Removed from the DOM once dismissed. -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="mascot-frame">
        <img id="mascot-img" class="mascot" src="assets/mascot.png" alt="" />
        <span class="mascot-fallback" aria-hidden="true">🐒</span>
      </div>
      <h1 class="splash-title">Fitness &amp; Wellness Tracker</h1>
      <p class="splash-sub">Let's get after it</p>
    </div>
  </div>

  <div class="phone">

    <header class="app-header">
      <h1 id="header-title">Home</h1>
    </header>

    <main class="app-body">

      <!-- Home -->
      <section id="view-home" class="view active">
        <div class="card day-counter">
          <p class="day-label">90 Day Challenge</p>
          <p class="day-number" id="day-number">—</p>
          <p class="day-sub" id="day-sub">Not started</p>
          <div class="progress-track">
            <div class="progress-fill" id="day-progress-bar"></div>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">Today's Checklist</h2>
          <div id="checklist-container"></div>
        </div>

        <div class="card">
          <h2 class="card-title">Habit Consistency</h2>
          <div id="consistency-container"></div>
        </div>

        <div class="card">
          <h2 class="card-title">Top Lifts</h2>
          <div id="home-lifts-container">
            <p class="empty-state">No lifts yet.</p>
          </div>
        </div>
      </section>

      <!-- Lifts -->
      <section id="view-lifts" class="view">
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">My Lifts</h2>
            <button id="add-lift-toggle" class="btn btn-small">+ Add</button>
          </div>

          <form id="add-lift-form" class="inline-form hidden">
            <input type="text" id="new-lift-name" placeholder="Lift name (e.g. Bench Press)"
                   maxlength="30" autocomplete="off" />
            <div class="form-row">
              <input type="number" id="new-lift-weight" placeholder="Weight (kg)" min="0" step="0.5" />
              <input type="number" id="new-lift-reps" placeholder="Reps" min="1" step="1" />
            </div>
            <p class="form-error hidden" id="add-lift-error"></p>
            <div class="form-actions">
              <button type="button" class="btn btn-ghost" id="cancel-lift-btn">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Lift</button>
            </div>
          </form>
        </div>

        <div id="lifts-container"></div>
      </section>

      <!-- Workouts -->
      <section id="view-workouts" class="view">

        <div id="program-timeline" class="timeline"></div>

        <div id="program-container"></div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">Training Program</h2>
            <button id="clear-program-btn" class="btn btn-ghost btn-small btn-danger">Clear</button>
          </div>
          <label class="file-drop">
            <input type="file" id="program-file" accept="application/json,.json" />
            <span class="file-drop-text">Import a program (.json)</span>
          </label>
          <p id="import-status" class="import-status hidden"></p>
        </div>

        <details class="card one-off">
          <summary class="one-off-summary">One-off workouts</summary>

          <div class="one-off-body">
            <button id="add-workout-toggle" class="btn btn-small">+ Add</button>

            <form id="add-workout-form" class="inline-form hidden">
              <input type="text" id="new-workout-name" placeholder="Workout name (e.g. Push Day)"
                     maxlength="40" autocomplete="off" />
              <input type="date" id="new-workout-date" />

              <div id="exercise-rows"></div>
              <button type="button" id="add-exercise-row" class="btn btn-ghost btn-small">
                + Add exercise
              </button>

              <p class="form-error hidden" id="add-workout-error"></p>
              <div class="form-actions">
                <button type="button" class="btn btn-ghost" id="cancel-workout-btn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Workout</button>
              </div>
            </form>

            <div id="workouts-container"></div>
          </div>
        </details>
      </section>

      <!-- Diet -->
      <section id="view-diet" class="view">
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">Protein Today</h2>
            <button id="edit-target-btn" class="btn btn-ghost btn-small">Target</button>
          </div>
          <div id="protein-summary"></div>
        </div>

        <div class="card">
          <h2 class="card-title">Add a Meal</h2>
          <div id="meal-picker" class="meal-picker"></div>
        </div>

        <div id="meals-container"></div>

        <div class="card">
          <h2 class="card-title">Last 7 Days</h2>
          <div id="protein-history"></div>
        </div>
      </section>

    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="home">
        <span class="nav-icon">✓</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-btn" data-view="lifts">
        <span class="nav-icon">🏋</span>
        <span class="nav-label">Lifts</span>
      </button>
      <button class="nav-btn" data-view="workouts">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Workouts</span>
      </button>
      <button class="nav-btn" data-view="diet">
        <span class="nav-icon">🍽</span>
        <span class="nav-label">Diet</span>
      </button>
    </nav>

  </div>

  <script src="js/splash.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/diet.js"></script>
  <script src="js/program.js"></script>
  <script src="js/lifts.js"></script>
  <script src="js/challenge.js"></script>
  <script src="js/workouts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
